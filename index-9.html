<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#262D33">
<title>Tap Tempo</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#262D33; --edge:#3A434B; --ink:#E3E8EC; --muted:#99A5AF;
  --pad:#46525E; --pad-press:#2F3942; --pad-ink:#F1F4F6; --pad-rim:#5E6B77;
  --screen:#16241D; --screen-ink:#9CF0AE; --screen-dim:#3F6A4E; --screen-grid:#23382C;
  --led:#FFA528; --led-accent:#FF4A2B; --led-off:#4A433B; --clap:#6FC3FF;
  --font:"Chakra Petch","Segoe UI",Roboto,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--panel);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px}
@media (min-aspect-ratio:1/1){ .app{flex-direction:row} .screen,.pad{flex:1 1 0} }

.screen{flex:1.25 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;
  background:var(--screen);color:var(--screen-ink);border-radius:12px;border:3px solid var(--edge);
  padding:10px 12px 8px;box-shadow:inset 0 2px 8px rgba(0,0,0,.55)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;opacity:.85}
.leds{display:flex;gap:8px}
.led{width:12px;height:12px;border-radius:50%;background:var(--led-off)}
.led.on{background:var(--led);box-shadow:0 0 10px 2px rgba(255,165,40,.7)}
.led.first.on{background:var(--led-accent);box-shadow:0 0 12px 3px rgba(255,74,43,.75)}
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.bpm{font-size:clamp(3rem,min(17vw,13vh),7rem);font-weight:600;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 0 12px rgba(156,240,174,.35)}
.bpm.empty{color:var(--screen-dim);text-shadow:none}
.side{text-align:right;padding-bottom:4px}
.unit{font-size:1rem;font-weight:500}
.style{font-size:.8rem;opacity:.8;margin-top:3px}
.conf{height:4px;border-radius:2px;background:var(--screen-grid);overflow:hidden}
#confBar{height:100%;width:0;background:var(--screen-ink);transition:width .3s}
.tapline{display:flex;justify-content:space-between;font-size:.85rem;font-variant-numeric:tabular-nums;opacity:.9;min-height:1.2em}
#graph{flex:1 1 0;min-height:40px;width:100%;display:block}
.ref{font-size:.85rem;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.ref.link{color:var(--led);text-decoration:underline}
.msg{font-size:.75rem;opacity:.75;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.warn{color:var(--led);opacity:1}

.pad{flex:1 1 0;min-height:0;width:100%;border:0;border-radius:14px;background:var(--pad);color:var(--pad-ink);
  font:inherit;font-size:1.5rem;font-weight:600;box-shadow:inset 0 0 0 4px var(--pad-rim),0 5px 0 var(--edge);
  touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pad small{font-size:.8rem;font-weight:400;opacity:.65}
.pad.hit{background:var(--pad-press);box-shadow:inset 0 0 0 4px var(--led),0 1px 0 var(--edge)}
</style>
</head>
<body>
<div class="app">
  <section class="screen" id="screen" aria-live="polite">
    <div class="top"><span id="src">Démarrage</span><div class="leds" aria-hidden="true"><i class="led first" id="l0"></i><i class="led" id="l1"></i><i class="led" id="l2"></i><i class="led" id="l3"></i></div></div>
    <div class="readout">
      <div id="bpm" class="bpm empty">---.-</div>
      <div class="side"><div class="unit">BPM</div><div class="style" id="style"></div></div>
    </div>
    <div class="conf"><div id="confBar"></div></div>
    <div class="ref" id="ref"></div>
    <div class="tapline"><span id="tapTxt"></span><span id="gapTxt"></span></div>
    <canvas id="graph" aria-hidden="true"></canvas>
    <div class="msg" id="msg">Démarrage…</div>
  </section>
  <button class="pad" id="pad" type="button">Tap<small>au rythme de la musique</small></button>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const N = 1024, HOP = 256, WIN = 12, LO = 90, HI = 180, VIS_FPS = 20;
  const bpmEl = $('bpm'), styleEl = $('style'), confBar = $('confBar'), msgEl = $('msg'), refEl = $('ref'), srcEl = $('src');
  const tapTxt = $('tapTxt'), gapTxt = $('gapTxt'), canvas = $('graph'), g = canvas.getContext('2d');
  const leds = [0, 1, 2, 3].map(i => $('l' + i));
  const rms = a => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / a.length); };
  const css = () => getComputedStyle(document.documentElement);
  const NATIVE = window.TTNative || null;
  let lastMsg = '';
  function setMsg(t, warn){ if (t === lastMsg) return; lastMsg = t; msgEl.textContent = t; msgEl.classList.toggle('warn', !!warn); }

  const STYLES = [
    [60, 80, 'Downtempo, reggae'], [80, 100, 'Hip-hop, R&B'], [88, 102, 'Reggaeton'],
    [100, 118, 'Pop, funk, disco'], [118, 130, 'House'], [125, 145, 'Techno'],
    [130, 142, 'Trance'], [138, 150, 'Dubstep, trap'], [150, 165, 'Hardstyle'],
    [165, 180, 'Drum & bass'], [180, 220, 'Hardcore, punk']
  ];
  function styleFor(v){
    const m = STYLES.filter(([a, b]) => v >= a && v < b).map(s => s[2]);
    return m.slice(0, 2).join(' ou ');
  }

  // FFT radix-2
  const HANN = new Float32Array(N).map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
  const BITS = Math.log2(N), REV = new Uint32Array(N);
  for (let i = 0; i < N; i++){ let r = 0; for (let b = 0; b < BITS; b++) r |= ((i >> b) & 1) << (BITS - 1 - b); REV[i] = r; }
  const COS = new Float32Array(N / 2), SIN = new Float32Array(N / 2);
  for (let i = 0; i < N / 2; i++){ COS[i] = Math.cos(2 * Math.PI * i / N); SIN[i] = Math.sin(2 * Math.PI * i / N); }
  function fft(re, im){
    for (let i = 0; i < N; i++){ const j = REV[i]; if (j > i){ let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let size = 2; size <= N; size <<= 1){
      const half = size >> 1, step = N / size;
      for (let i = 0; i < N; i += size){
        for (let j = 0, k = 0; j < half; j++, k += step){
          const a = i + j, b = a + half;
          const tr = re[b] * COS[k] + im[b] * SIN[k], ti = im[b] * COS[k] - re[b] * SIN[k];
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        }
      }
    }
  }

  // Détecteur d'attaques : 36 bandes logarithmiques de 30 Hz à 10 kHz
  function makeOnset(sr){
    const nb = 36, fLo = 30, fHi = Math.min(10000, sr / 2 - 200), edges = [];
    for (let b = 0; b <= nb; b++) edges.push(Math.max(1, Math.round(fLo * Math.pow(fHi / fLo, b / nb) * N / sr)));
    for (let b = 1; b <= nb; b++) if (edges[b] <= edges[b - 1]) edges[b] = edges[b - 1] + 1;
    const wt = new Float32Array(nb), kind = new Uint8Array(nb);
    for (let b = 0; b < nb; b++){
      const fc = (edges[b] + edges[b + 1]) / 2 * sr / N;
      wt[b] = fc < 180 ? 1.6 : fc < 2000 ? 1 : 0.8;
      kind[b] = fc < 150 ? 1 : (fc > 1000 && fc < 6000) ? 2 : 0;   // 1 = DOUM, 2 = CLAC
    }
    const buf = new Float32Array(N), re = new Float32Array(N), im = new Float32Array(N), prev = new Float32Array(nb);
    const norm = 2 / (N / 2);
    let first = true;
    return samples => {
      if (samples.length === HOP){ buf.copyWithin(0, HOP); buf.set(samples, N - HOP); }
      else { buf.fill(0); const L = Math.min(N, samples.length); buf.set(samples.subarray(samples.length - L), N - L); }
      for (let i = 0; i < N; i++){ re[i] = buf[i] * HANN[i]; im[i] = 0; }
      fft(re, im);
      let flux = 0, kick = 0, clap = 0;
      for (let b = 0; b < nb; b++){
        let e = 0; const a = edges[b], z = Math.min(edges[b + 1], N / 2);
        for (let k = a; k < z; k++) e += (re[k] * re[k] + im[k] * im[k]) * norm * norm;
        const l = Math.log1p(1e4 * e / Math.max(1, z - a));
        if (!first){
          const d = Math.max(0, l - prev[b]);
          flux += wt[b] * d;
          if (kind[b] === 1) kick += d; else if (kind[b] === 2) clap += d;
        }
        prev[b] = l;
      }
      first = false;
      // Enveloppe de tempo : tout le spectre, avec le DOUM et le CLAC mis en avant
      return { tempo: flux + 1.0 * kick + 0.6 * clap, kick, clap };
    };
  }

  // Autocorrélation de l'enveloppe (détendue), normalisée
  function acfOf(env, fps){
    const n = env.length, maxLag = Math.round(4 * fps) + 2;
    if (n < Math.max(fps * 3, 60)) return null;
    const w = Math.max(1, Math.round(fps * 0.25)), ps = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) ps[i + 1] = ps[i] + env[i];
    const x = new Float32Array(n);
    for (let i = 0; i < n; i++){ const a = Math.max(0, i - w), b = Math.min(n, i + w + 1); x[i] = Math.max(0, env[i] - (ps[b] - ps[a]) / (b - a)); }
    const ac = new Float64Array(maxLag + 2);
    for (let L = 0; L <= maxLag + 1; L++){
      if (L >= n){ ac[L] = 0; continue; }
      let r = 0; for (let i = L; i < n; i++) r += x[i] * x[i - L];
      ac[L] = r / (n - L);
    }
    const z = ac[0] || 1; for (let L = 0; L < ac.length; L++) ac[L] /= z;
    return { ac, x };
  }

  // Peigne d'harmoniques sur une grille fine de 0,05 BPM
  function scoreTempo(ac, fps, lo, hi){
    const maxLag = ac.length - 2;
    const at = f => { const i = Math.floor(f); if (i + 1 > maxLag || i < 1) return 0; const t = f - i; return ac[i] * (1 - t) + ac[i + 1] * t; };
    const mid = Math.sqrt(lo * hi), step = 0.05, sc = [], raw = [];
    let best = -Infinity, bi = 0;
    for (let b = lo, i = 0; b <= hi + 1e-9; b += step, i++){
      const L = 60 * fps / b;
      const r = at(L) + 0.5 * at(2 * L) + 0.33 * at(3 * L) + 0.25 * at(4 * L);
      const s = r * Math.exp(-0.5 * (Math.log2(b / mid) / 0.7) ** 2);
      raw.push(r); sc.push(s); if (s > best){ best = s; bi = i; }
    }
    // La préférence de plage choisit le bon pic, mais la valeur exacte vient du pic brut (sans biais)
    const win = Math.max(2, Math.round((lo + bi * step) * 0.02 / step));
    let ri = bi;
    for (let i = Math.max(0, bi - win); i <= Math.min(raw.length - 1, bi + win); i++) if (raw[i] > raw[ri]) ri = i;
    let off = 0;
    if (ri > 0 && ri < raw.length - 1){ const a = raw[ri - 1], b2 = raw[ri], c = raw[ri + 1], d = a - 2 * b2 + c; if (d < 0) off = 0.5 * (a - c) / d; }
    const bpm = lo + (ri + off) * step;
    const mean = sc.reduce((p, v) => p + v, 0) / sc.length;
    const sd = Math.sqrt(sc.reduce((p, v) => p + (v - mean) ** 2, 0) / sc.length) || 1e-9;
    const conf = Math.min(1, Math.max(0, ((best - mean) / sd - 1.5) / 3));
    return { bpm, conf };
  }

  function phaseOf(x, fps, bpm){
    const n = x.length, lag = 60 * fps / bpm, span = Math.min(n, Math.round(fps * 4));
    let bestP = 0, bestS = -1;
    for (let p = 0; p < Math.round(lag); p++){
      let s = 0;
      for (let k = 0; ; k++){ const i = n - 1 - p - Math.round(k * lag); if (i < n - span || i < 0) break; s += x[i]; }
      if (s > bestS){ bestS = s; bestP = p; }
    }
    return bestP;
  }

  // Un coup = pic local nettement au-dessus du niveau des 1,5 dernières secondes
  function peakAt(arr, fps, st, now){
    const n = arr.length; if (n < fps) return false;
    const v = arr[n - 2];
    st.peak = Math.max(st.peak * 0.998, arr[n - 1]);     // mémoire des coups récents les plus forts
    if (!(v > arr[n - 3] && v >= arr[n - 1])) return false;
    if (now - st.last < 110) return false;
    if (v < st.ratio * st.peak) return false;            // ignore les fuites (charley, kick dans les aigus…)
    const span = Math.min(n, Math.round(fps * 1.5));
    let m = 0, q = 0;
    for (let i = n - span; i < n; i++){ m += arr[i]; q += arr[i] * arr[i]; }
    m /= span; const sd = Math.sqrt(Math.max(0, q / span - m * m));
    return v > m + 2.2 * sd && v > 0.05;
  }

  /* ----- Suivi des temps (programmation dynamique, méthode d'Ellis) ----- */
  function normArr(a){
    const n = a.length; let m = 0; for (let i = 0; i < n; i++) m += a[i]; m /= n || 1;
    let q = 0; for (let i = 0; i < n; i++) q += (a[i] - m) ** 2;
    const sd = Math.sqrt(q / (n || 1)) || 1, out = new Float32Array(n);
    for (let i = 0; i < n; i++) out[i] = a[i] / sd;
    return out;
  }
  function smoothArr(a, sigma){
    const r = Math.max(1, Math.ceil(sigma * 2.5)), k = [];
    let ks = 0; for (let j = -r; j <= r; j++){ const v = Math.exp(-0.5 * (j / sigma) ** 2); k.push(v); ks += v; }
    const n = a.length, out = new Float32Array(n);
    for (let i = 0; i < n; i++){ let s = 0; for (let j = -r; j <= r; j++){ const x = i + j; if (x >= 0 && x < n) s += a[x] * k[j + r]; } out[i] = s / ks; }
    return out;
  }
  function dpBeats(o, tau, tight){
    const n = o.length, C = new Float32Array(n), P = new Int32Array(n).fill(-1);
    const dLo = Math.max(1, Math.round(tau / 2)), dHi = Math.round(tau * 2);
    const pen = new Float32Array(dHi + 1);
    for (let d = dLo; d <= dHi; d++) pen[d] = -tight * Math.log(d / tau) ** 2;
    for (let t = 0; t < n; t++){
      let best = -Infinity, bp = -1;
      for (let d = dLo; d <= dHi && t - d >= 0; d++){ const v = C[t - d] + pen[d]; if (v > best){ best = v; bp = t - d; } }
      C[t] = o[t] + (bp >= 0 ? Math.max(0, best) : 0); P[t] = best > 0 ? bp : -1;
    }
    let end = n - 1, bv = -Infinity;
    for (let t = Math.max(0, n - 1 - Math.round(tau)); t < n; t++) if (C[t] > bv){ bv = C[t]; end = t; }
    const beats = []; for (let t = end; t >= 0; t = P[t]){ beats.push(t); if (P[t] < 0) break; }
    return beats.reverse();
  }
  const peakNear = (a, f, r) => { let m = 0; for (let i = Math.round(f) - r; i <= Math.round(f) + r; i++) if (i >= 0 && i < a.length && a[i] > m) m = a[i]; return m; };

  function fitLine(pos){
    const n = pos.length, mi = (n - 1) / 2, mp = pos.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++){ num += (i - mi) * (pos[i] - mp); den += (i - mi) ** 2; }
    const b = num / den, a = mp - b * mi;
    let q = 0; for (let i = 0; i < n; i++) q += (pos[i] - (a + b * i)) ** 2;
    return { a, b, sd: Math.sqrt(q / n) };
  }

  // Analyse complète : tempo grossier (autocorrélation) -> temps placés un par un ->
  // calage sur les DOUM/CLAC -> tempo fin par régression -> temps 1 de la mesure
  function analyzeBeats(env, kEnv, cEnv, fps, ac, lo, hi){
    const coarse = scoreTempo(ac, fps, lo, hi);
    const tau = 60 * fps / coarse.bpm, n = env.length;
    const kn = normArr(kEnv), cn = normArr(cEnv), en = normArr(env);
    const mix = new Float32Array(n);
    for (let i = 0; i < n; i++) mix[i] = en[i] + 0.5 * kn[i] + 0.3 * cn[i];
    const o = normArr(smoothArr(mix, Math.max(1, tau / 32)));
    let beats = dpBeats(o, tau, 100);
    if (beats.length < 4) return { bpm: coarse.bpm, conf: coarse.conf * 0.5, last: null, bar: 0, coarse };

    // Temps ou contretemps ? Les DOUM et CLAC tombent sur les temps
    let on = 0, off = 0;
    for (const b of beats){ on += peakNear(kn, b, 2) + peakNear(cn, b, 2); off += peakNear(kn, b + tau / 2, 2) + peakNear(cn, b + tau / 2, 2); }
    if (off > on * 1.25) beats = beats.map(b => b + tau / 2).filter(b => b < n - 1);

    // Position fine de chaque temps (sous la trame)
    const pos = beats.map(b => {
      let m = Math.round(b), mv = -Infinity;
      for (let i = Math.round(b) - 2; i <= Math.round(b) + 2; i++) if (i > 0 && i < n - 1 && o[i] > mv){ mv = o[i]; m = i; }
      const a = o[m - 1] ?? 0, c = o[m + 1] ?? 0, d = a - 2 * o[m] + c;
      return d < 0 ? m + 0.5 * (a - c) / d : m;
    });
    const use = pos.length > 6 ? pos.slice(1) : pos;      // le premier temps est souvent imprécis
    const f = fitLine(use);
    let bpm = 60 * fps / f.b;
    if (!(bpm > lo * 0.9 && bpm < hi * 1.1) || Math.abs(bpm / coarse.bpm - 1) > 0.04) bpm = coarse.bpm;
    const steady = Math.min(1, Math.max(0, 1 - f.sd / (0.08 * f.b)));
    const conf = Math.min(1, 0.5 * coarse.conf + 0.5 * steady) * Math.min(1, use.length / 8);

    // Temps 1 : DOUM sur 1 et 3, CLAC sur 2 et 4
    const wK = [1, -0.3, 0.6, -0.3], wC = [-0.4, 1, -0.4, 1];
    let bestPh = 0, bestS = -Infinity;
    for (let ph = 0; ph < 4; ph++){
      let s = 0;
      pos.forEach((p, i) => { const k = ((i - ph) % 4 + 4) % 4; s += wK[k] * peakNear(kn, p, 2) + wC[k] * peakNear(cn, p, 2) + (k === 0 ? 0.2 * peakNear(en, p, 2) : 0); });
      if (s > bestS){ bestS = s; bestPh = ph; }
    }
    const lastIdx = use.length - 1, last = f.a + f.b * lastIdx;     // dernier temps, recalé sur la droite
    const bar = (((pos.length - 1) - bestPh) % 4 + 4) % 4;
    return { bpm, conf, last, bar, coarse, half: f, pos };
  }



  /* ---------- Deux sources d'écoute ----------
     hd  : capture du son des applis (44,1 kHz) — la meilleure, mais certaines applis la bloquent
     vis : visualiseur Android (mélange final du téléphone, ~20 images/s) — passe là où hd est bloqué */
  function makeAn(name){
    return { name, onset: null, fps: 0, env: [], kEnv: [], cEnv: [], tEnd: 0, level: 0, lastSound: -1e9,
      acc: null, accN: 0, bpm: null, conf: 0, beatT: null, beatBar: 0, periodMs: null,
      kicks: [], claps: [], kSt: null, cSt: null, buf: null, bufN: 0, t0: null, lastIdx: -1 };
  }
  const hd = makeAn('hd'), vis = makeAn('vis');
  function initAn(a, sr, fps){
    Object.assign(a, { onset: makeOnset(sr), fps, env: [], kEnv: [], cEnv: [], level: 0, acc: null, accN: 0, bpm: null, conf: 0,
      beatT: null, periodMs: null, kicks: [], claps: [], kSt: { last: 0, peak: 0, ratio: 0.4 }, cSt: { last: 0, peak: 0, ratio: 0.55 },
      buf: new Float32Array(HOP), bufN: 0, t0: null, lastIdx: -1 });
  }
  function relearn(a){ Object.assign(a, { acc: null, accN: 0, bpm: null, conf: 0, beatT: null, periodMs: null }); }

  function pushEnv(a, tempo, kick, clap, t){
    a.env.push(tempo); a.kEnv.push(kick); a.cEnv.push(clap);
    const maxN = Math.round(a.fps * WIN);
    if (a.env.length > maxN){ const d = a.env.length - maxN; a.env.splice(0, d); a.kEnv.splice(0, d); a.cEnv.splice(0, d); }
    a.tEnd = t;
  }
  function onFrame(a, samples, t){
    const o = a.onset(samples);
    pushEnv(a, o.tempo, o.kick, o.clap, t);
    const r = rms(samples);
    a.level = Math.max(r, a.level * 0.95);
    if (r > 0.003) a.lastSound = t;
    const tHit = t - 1000 / a.fps;
    if (peakAt(a.kEnv, a.fps, a.kSt, tHit)){ a.kSt.last = tHit; a.kicks.push(tHit); }
    if (peakAt(a.cEnv, a.fps, a.cSt, tHit) && tHit - a.kSt.last > 70){ a.cSt.last = tHit; a.claps.push(tHit); }
    const old = t - 5000;
    while (a.kicks.length && a.kicks[0] < old) a.kicks.shift();
    while (a.claps.length && a.claps[0] < old) a.claps.shift();
  }

  /* ---------- Référence du morceau (titre lu dans la notif + fiche Deezer + analyse de l'extrait) ---------- */
  let meta = null, metaPerm = null, ref = null, refToken = 0;
  const center = () => tapBpm() || (ref && (ref.ana || ref.bpm)) || null;
  const rangeFor = c => c ? [c / Math.SQRT2, c * Math.SQRT2] : [LO, HI];
  const fold = (x, r) => { if (!x || !r) return x; while (x / r > 1.41) x /= 2; while (r / x > 1.41) x *= 2; return x; };

  async function analyzePreview(b64, tok){
    const bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
    const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(u8.buffer, res, rej); if (p && p.then) p.then(res, rej); });
    if (ctx.close) ctx.close();
    const sr = buf.sampleRate, c0 = buf.getChannelData(0), c1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
    const frames = Math.floor(buf.length / HOP), onset = makeOnset(sr), tmp = new Float32Array(HOP);
    const env = new Float32Array(frames), k = new Float32Array(frames), c = new Float32Array(frames);
    for (let f = 0; f < frames; f++){
      const o = f * HOP;
      for (let i = 0; i < HOP; i++) tmp[i] = c1 ? (c0[o + i] + c1[o + i]) / 2 : c0[o + i];
      const r = onset(tmp); env[f] = r.tempo; k[f] = r.kick; c[f] = r.clap;
      if (f % 1500 === 0){ await new Promise(r2 => setTimeout(r2, 0)); if (tok !== refToken) return null; }
    }
    const fps = sr / HOP, r = acfOf(env, fps);
    if (!r) return null;
    const [lo, hi] = rangeFor(ref && ref.bpm > 0 ? ref.bpm : tapBpm());
    return analyzeBeats(env, k, c, fps, r.ac, lo, hi).bpm;
  }

  window.__ttMetaPerm = ok => { metaPerm = !!ok; render(); };
  window.__ttMeta = (title, artist, pkg, playing) => {
    const key = artist + '|' + title;
    if (!meta || meta.key !== key){
      ref = null; refToken++;
      relearn(hd); relearn(vis);
    }
    meta = { key, title, artist, pkg, playing };
    render();
  };
  window.__ttRef = async o => {
    const tok = ++refToken;
    if (!o){ ref = { none: true }; render(); return; }
    ref = { title: o.title, artist: o.artist, bpm: o.bpm > 0 ? o.bpm : null, ana: null, busy: !!o.preview };
    render();
    if (o.preview && NATIVE){
      try {
        const b64 = NATIVE.preview();
        const v = b64 ? await analyzePreview(b64, tok) : null;
        if (tok !== refToken) return;
        ref.ana = v ? (ref.bpm ? fold(v, ref.bpm) : v) : null;
      } catch (_) {}
      if (tok === refToken){ ref.busy = false; relearn(hd); relearn(vis); render(); }
    }
  };

  /* ---------- Calcul ---------- */
  function analyze(a){
    if (!a.onset || performance.now() - a.lastSound > 2500) return;
    const r = acfOf(a.env, a.fps);
    if (!r) return;
    a.accN++;
    const w = Math.max(0.2, 1 / a.accN);
    if (!a.acc || a.acc.length !== r.ac.length) a.acc = Float64Array.from(r.ac);
    else for (let i = 0; i < r.ac.length; i++) a.acc[i] = a.acc[i] * (1 - w) + r.ac[i] * w;
    const [lo, hi] = rangeFor(center());
    const n = a.env.length, res = analyzeBeats(a.env, a.kEnv, a.cEnv, a.fps, a.acc, lo, hi);
    a.bpm = a.bpm && Math.abs(res.bpm / a.bpm - 1) < 0.02 ? a.bpm * 0.6 + res.bpm * 0.4 : res.bpm;
    a.conf = res.conf; a.periodMs = 60000 / a.bpm;
    if (res.last !== null){ a.beatT = a.tEnd - (n - 1 - res.last) / a.fps * 1000; a.beatBar = res.bar; }
  }
  function active(){
    const now = performance.now();
    if (hd.onset && now - hd.lastSound < 2500) return hd;
    if (vis.onset && now - vis.lastSound < 2500) return vis;
    return null;
  }
  setInterval(() => { analyze(hd); analyze(vis); render(); }, 400);

  /* ---------- Affichage ---------- */
  function render(){
    const a = active(), live = a && a.bpm && a.conf > 0.15 ? a.bpm : null;
    const rb = ref && (ref.ana || ref.bpm);
    // Le visualiseur est moins fin : s'il confirme la référence (à 2 % près), on affiche la référence, plus précise
    const locked = a === vis && live && rb && Math.abs(fold(live, rb) / rb - 1) < 0.02;
    const main = locked ? rb : (live || rb || null);
    srcEl.textContent = a === hd ? 'Son HD' : a === vis ? 'Visualiseur' : rb ? 'Référence du morceau' : NATIVE ? 'En attente du son' : 'Navigateur';
    if (main){
      bpmEl.textContent = main.toFixed(1); bpmEl.classList.remove('empty'); styleEl.textContent = styleFor(main);
      const pc = Math.round((locked ? Math.max(0.85, a.conf) : live ? a.conf : ref.ana ? 0.8 : 0.5) * 100);
      confBar.style.width = pc + '%';
      confBar.style.background = pc >= 70 ? 'var(--screen-ink)' : pc >= 40 ? 'var(--led)' : 'var(--led-accent)';
    }
    // Ligne du morceau
    refEl.classList.remove('link');
    if (metaPerm === false){ refEl.textContent = '▶ Touche ici : activer la reconnaissance du morceau'; refEl.classList.add('link'); }
    else if (meta){
      let t = `${meta.artist ? meta.artist + ' – ' : ''}${meta.title}`;
      if (ref && ref.none) t += ' · pas de fiche';
      else if (ref){
        if (rb) t += ` · réf ${rb.toFixed(1)}`;
        if (ref.busy) t += ' · analyse…';
        if (live && rb) t += (locked || Math.abs(fold(live, rb) - rb) < 1) ? ' ✓ confirmé' : ` (en direct ${fold(live, rb).toFixed(1)})`;
      } else t += ' · recherche…';
      refEl.textContent = t;
    } else refEl.textContent = '';
    showTap(main);
    // Message
    if (!NATIVE) return;
    if (meta && !meta.playing) setMsg('Musique en pause.');
    else if (a === hd) setMsg(a.bpm ? (a.conf > 0.6 ? 'Mesure fiable (son HD).' : 'Mesure en cours…') : 'J’écoute… quelques secondes.');
    else if (a === vis) setMsg(hd.onset ? 'Cette appli bloque le son HD → visualiseur.' : 'Mesure via le visualiseur.');
    else if (rb) setMsg('Pas de son capté : BPM du morceau affiché.', true);
    else if (hd.onset || vis.onset) setMsg('Aucun son capté : lance la musique.', true);
  }

  /* ---------- Capture HD (appli Android) ---------- */
  let hdPending = false;
  function startNative(){
    if (hdPending || hd.onset) return;
    hdPending = true;
    setMsg('Autorise la capture : « Tout l’écran » puis Démarrer.');
    NATIVE.start();
  }
  window.__ttCaptureStarted = sr => { hdPending = false; initAn(hd, sr, sr / HOP); };
  window.__ttPcm = b64 => {
    if (!hd.onset) return;
    const bin = atob(b64), n = bin.length >> 1, buf = hd.buf, t = performance.now();
    for (let i = 0; i < n; i++){
      let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
      if (v >= 32768) v -= 65536;
      buf[hd.bufN++] = v / 32768;
      if (hd.bufN === HOP){ onFrame(hd, buf, t); hd.bufN = 0; }
    }
  };
  window.__ttCaptureError = m => { hdPending = false; hd.onset = null; setMsg(m, true); };
  window.__ttCaptureStopped = () => { hdPending = false; hd.onset = null; render(); };

  /* ---------- Visualiseur ---------- */
  let visBuf = null;
  window.__ttVisState = ok => { if (!ok) vis.onset = null; };
  window.__ttVis = (b64, srMilli) => {
    const bin = atob(b64), n = bin.length, t = performance.now();
    if (!vis.onset){ initAn(vis, (srMilli || 44100000) / 1000, VIS_FPS); }
    if (!visBuf || visBuf.length !== n) visBuf = new Float32Array(n);
    for (let i = 0; i < n; i++) visBuf[i] = ((bin.charCodeAt(i) & 255) - 128) / 128;
    // Grille régulière à 20 images/s, quels que soient les à-coups des rappels
    if (vis.t0 === null){ vis.t0 = t; vis.lastIdx = -1; }
    let idx = Math.round((t - vis.t0) * VIS_FPS / 1000);
    if (idx <= vis.lastIdx) return;
    if (idx - vis.lastIdx > 10){ vis.lastIdx = idx - 1; }
    for (let j = vis.lastIdx + 1; j < idx; j++) pushEnv(vis, 0, 0, 0, vis.t0 + j * 1000 / VIS_FPS);
    vis.lastIdx = idx;
    onFrame(vis, visBuf, t);
  };

  /* ---------- Repli navigateur : micro ---------- */
  let micBusy = false;
  async function startMic(){
    if (hd.onset || micBusy) return;
    if (!/^https?:$/.test(location.protocol) || !navigator.mediaDevices){ setMsg('Ici : tap uniquement. Le casque marche dans l’appli.', true); return; }
    micBusy = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
      try { await ctx.resume(); } catch (_) {}
      const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(HOP, 1, 1), mute = ctx.createGain();
      mute.gain.value = 0; src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
      initAn(hd, ctx.sampleRate, ctx.sampleRate / HOP);
      proc.onaudioprocess = e => onFrame(hd, e.inputBuffer.getChannelData(0), performance.now());
      setMsg('J’écoute au micro…');
    } catch (e){ setMsg('Micro refusé.', true); }
    micBusy = false;
  }

  $('screen').addEventListener('click', () => { if (hd.onset) return; NATIVE ? startNative() : startMic(); });
  refEl.addEventListener('click', e => { if (metaPerm === false && NATIVE){ e.stopPropagation(); NATIVE.notifSettings(); } });

  /* ---------- Tap ---------- */
  let taps = [];
  const pad = $('pad');
  function tapBpm(){
    if (taps.length < 2 || performance.now() - taps[taps.length - 1] > 8000) return null;
    const t = taps.slice(-12), n = t.length, mi = (n - 1) / 2, mt = t.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++){ num += (i - mi) * (t[i] - mt); den += (i - mi) ** 2; }
    return 60000 / (num / den);
  }
  function showTap(main){
    const tb = tapBpm();
    if (!tb){ tapTxt.textContent = taps.length ? '' : 'Tape pour comparer'; gapTxt.textContent = ''; return; }
    tapTxt.textContent = `Ton tap ${tb.toFixed(1)}`;
    if (main){ const d = tb - main; gapTxt.textContent = Math.abs(d) < 0.5 ? 'pile dessus ✓' : `écart ${d > 0 ? '+' : ''}${d.toFixed(1)}`; }
  }
  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now); if (taps.length > 16) taps.shift();
    pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 90);
    const a = active();
    if (!(a && a.bpm) && !(ref && (ref.ana || ref.bpm))){ const tb = tapBpm(); if (tb){ bpmEl.textContent = tb.toFixed(1); bpmEl.classList.remove('empty'); styleEl.textContent = styleFor(tb); } }
    showTap(a && a.bpm);
    if (!hd.onset && !NATIVE) startMic();
  });

  /* ---------- Afficheur graphique ---------- */
  function size(){
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return null;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){ canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    return { w, h };
  }
  let lastK = null;
  function draw(){
    requestAnimationFrame(draw);
    const s = size(); if (!s) return;
    const { w, h } = s, c = css(), a = active();
    const ink = c.getPropertyValue('--screen-ink').trim(), dim = c.getPropertyValue('--screen-dim').trim();
    const grid = c.getPropertyValue('--screen-grid').trim(), led = c.getPropertyValue('--led').trim();
    const hot = c.getPropertyValue('--led-accent').trim(), clap = c.getPropertyValue('--clap').trim();
    const SPAN = 4000, meterW = 6, gw = w - meterW - 6, now = performance.now();
    const tEnd = a ? Math.max(a.tEnd, now - 120) : now, t0 = tEnd - SPAN, X = t => (t - t0) / SPAN * gw;
    g.strokeStyle = grid; g.lineWidth = 1; g.beginPath(); g.moveTo(0, h - .5); g.lineTo(gw, h - .5); g.stroke();
    // Grille des temps : celle de la source active, sinon celle de la référence (sans phase)
    if (a && a.periodMs && a.beatT !== null){
      const p = a.periodMs;
      for (let k = Math.ceil((t0 - a.beatT) / p); a.beatT + k * p <= tEnd; k++){
        const x = Math.round(X(a.beatT + k * p)) + .5, down = ((a.beatBar + k) % 4 + 4) % 4 === 0;
        g.strokeStyle = down ? hot : led; g.globalAlpha = down ? .9 : .5; g.lineWidth = down ? 2.5 : 1.5;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
      }
      g.globalAlpha = 1;
      const k = Math.floor((now - a.beatT) / p);
      if (lastK !== null && k !== lastK){
        const el = leds[((a.beatBar + k) % 4 + 4) % 4];
        el.classList.add('on'); setTimeout(() => el.classList.remove('on'), Math.min(120, p * .4));
      }
      lastK = k;
    } else lastK = null;
    if (a && a.env.length){
      const show = Math.min(a.env.length, Math.round(a.fps * SPAN / 1000)), seg = a.env.slice(a.env.length - show);
      const sorted = Array.from(seg).sort((x, y) => x - y), mx = Math.max(1e-3, sorted[Math.floor(sorted.length * 0.98)] || 0);
      const bw = Math.max(1, gw / (a.fps * SPAN / 1000) - (a === vis ? 1 : 0));
      g.fillStyle = ink;
      seg.forEach((v, i) => { const x = X(a.tEnd - (show - 1 - i) * 1000 / a.fps), bh = Math.min(1, v / mx) * (h - 14); if (bh > .5) g.fillRect(x, h - bh, bw, bh); });
      g.fillStyle = hot; for (const t of a.kicks) if (t >= t0){ g.beginPath(); g.arc(X(t), h - 5, 3.5, 0, 7); g.fill(); }
      g.fillStyle = clap; for (const t of a.claps) if (t >= t0){ const x = X(t); g.beginPath(); g.moveTo(x, 2); g.lineTo(x - 4, 9); g.lineTo(x + 4, 9); g.fill(); }
    } else {
      g.fillStyle = dim; g.font = '500 12px ' + c.getPropertyValue('--font');
      g.fillText('En attente du son…', 6, h / 2);
    }
    g.strokeStyle = '#FFFFFF'; g.globalAlpha = .85; g.lineWidth = 2;
    for (const t of taps) if (t >= t0){ const x = Math.round(X(t)) + .5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h * .35); g.stroke(); }
    g.globalAlpha = 1;
    const lv = a ? Math.min(1, Math.log1p(a.level * 300) / Math.log1p(300)) : 0;
    g.fillStyle = grid; g.fillRect(w - meterW, 0, meterW, h);
    g.fillStyle = lv > .92 ? hot : ink; g.fillRect(w - meterW, h - lv * h, meterW, lv * h);
  }
  requestAnimationFrame(draw);

  /* ---------- Démarrage automatique ---------- */
  if (NATIVE) setTimeout(startNative, 400);
  else { setMsg('Navigateur : touche l’afficheur ou le pad pour le micro.'); showTap(null); }
})();
</script>
</body>
</html>
