name: Construire l'APK Tap Tempo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'TT_EOF_0'
          plugins { id 'com.android.application' }

          android {
              namespace 'fr.taptempo.casque'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.taptempo.casque'
                  minSdk 29
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs {
                  fixed {
                      storeFile file('tt.keystore')
                      storePassword 'taptempo'
                      keyAlias 'tt'
                      keyPassword 'taptempo'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          TT_EOF_0
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'TT_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Tap Tempo"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          TT_EOF_1
          mkdir -p "$(dirname "app/src/main/java/fr/taptempo/casque/CaptureService.java")"
          cat > 'app/src/main/java/fr/taptempo/casque/CaptureService.java' <<'TT_EOF_2'
          package fr.taptempo.casque;

          import android.annotation.SuppressLint;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioPlaybackCaptureConfiguration;
          import android.media.AudioRecord;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.Base64;

          /** Capte le son joué par les autres applis (Android 10+), même quand il sort au casque. */
          public class CaptureService extends Service {
              public interface Listener {
                  void onStarted(int sampleRate);
                  void onPcm(String b64);
                  void onError(String msg);
                  void onStopped();
              }

              public static volatile Listener listener;
              public static final String EXTRA_CODE = "code", EXTRA_DATA = "data";
              private static final String CHANNEL = "capture";
              private static final int SR = 44100;

              private MediaProjection projection;
              private AudioRecord rec;
              private Thread worker;
              private volatile boolean running;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Écoute du son", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                          PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("Tap Tempo écoute le son du téléphone")
                          .setContentText("Touche pour revenir à l’appli")
                          .setContentIntent(open)
                          .setOngoing(true)
                          .build();
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);

                  if (running || intent == null) return START_NOT_STICKY;
                  try {
                      Intent data = intent.getParcelableExtra(EXTRA_DATA);
                      begin(intent.getIntExtra(EXTRA_CODE, 0), data);
                  } catch (Exception e) {
                      report("Impossible de démarrer la capture (" + e.getClass().getSimpleName() + ").");
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              @SuppressLint("MissingPermission")
              private void begin(int code, Intent data) {
                  MediaProjectionManager mpm = getSystemService(MediaProjectionManager.class);
                  projection = mpm.getMediaProjection(code, data);
                  if (projection == null) throw new IllegalStateException("projection");
                  projection.registerCallback(new MediaProjection.Callback() {
                      @Override public void onStop() { stopSelf(); }
                  }, new Handler(Looper.getMainLooper()));

                  AudioPlaybackCaptureConfiguration cfg = new AudioPlaybackCaptureConfiguration.Builder(projection)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                          .build();
                  AudioFormat fmt = new AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(SR)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build();
                  int min = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  rec = new AudioRecord.Builder()
                          .setAudioFormat(fmt)
                          .setBufferSizeInBytes(Math.max(min * 4, 32768))
                          .setAudioPlaybackCaptureConfig(cfg)
                          .build();
                  if (rec.getState() != AudioRecord.STATE_INITIALIZED) throw new IllegalStateException("AudioRecord");
                  rec.startRecording();
                  running = true;
                  Listener l = listener;
                  if (l != null) l.onStarted(SR);
                  worker = new Thread(this::loop, "capture");
                  worker.start();
              }

              private void loop() {
                  short[] buf = new short[1024];
                  byte[] bytes = new byte[2048];
                  while (running) {
                      int n = rec.read(buf, 0, buf.length);
                      if (n < 0) break;
                      if (n == 0) continue;
                      for (int i = 0; i < n; i++) {
                          bytes[2 * i] = (byte) buf[i];
                          bytes[2 * i + 1] = (byte) (buf[i] >> 8);
                      }
                      Listener l = listener;
                      if (l != null) l.onPcm(Base64.encodeToString(bytes, 0, n * 2, Base64.NO_WRAP));
                  }
              }

              private void report(String msg) {
                  Listener l = listener;
                  if (l != null) l.onError(msg);
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (rec != null) { try { rec.stop(); } catch (Exception ignored) {} }
                  if (worker != null) { try { worker.join(500); } catch (InterruptedException ignored) {} }
                  if (rec != null) { rec.release(); rec = null; }
                  if (projection != null) { MediaProjection p = projection; projection = null; p.stop(); }
                  Listener l = listener;
                  if (l != null) l.onStopped();
                  super.onDestroy();
              }
          }
          TT_EOF_2
          mkdir -p "$(dirname "app/src/main/java/fr/taptempo/casque/MainActivity.java")"
          cat > 'app/src/main/java/fr/taptempo/casque/MainActivity.java' <<'TT_EOF_3'
          package fr.taptempo.casque;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.projection.MediaProjectionConfig;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity implements CaptureService.Listener {
              private static final int REQ_PERM_CAPTURE = 1, REQ_PERM_MIC = 2, REQ_PROJECTION = 3, REQ_FILE = 4;
              private static final String START_URL = "https://appassets.androidplatform.net/assets/index.html";

              private WebView web;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private PermissionRequest pendingWebPerm;
              private ValueCallback<Uri[]> fileCb;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(0xFF262D33);
                  getWindow().setNavigationBarColor(0xFF262D33);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest req) {
                          ui.post(() -> {
                              if (hasMic()) {
                                  req.grant(req.getResources());
                              } else {
                                  pendingWebPerm = req;
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_PERM_MIC);
                              }
                          });
                      }

                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("audio/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "Choisir un morceau"), REQ_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.addJavascriptInterface(new Bridge(), "TTNative");
                  CaptureService.listener = this;
                  web.loadUrl(START_URL);
              }

              /** Appelé depuis le JavaScript de la page. */
              class Bridge {
                  @JavascriptInterface
                  public void start() { ui.post(MainActivity.this::beginCapture); }

                  @JavascriptInterface
                  public void stop() {
                      ui.post(() -> stopService(new Intent(MainActivity.this, CaptureService.class)));
                  }
              }

              private boolean hasMic() {
                  return checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
              }

              private void beginCapture() {
                  List<String> need = new ArrayList<>();
                  if (!hasMic()) need.add(Manifest.permission.RECORD_AUDIO);
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS);
                  }
                  if (!need.isEmpty()) {
                      requestPermissions(need.toArray(new String[0]), REQ_PERM_CAPTURE);
                      return;
                  }
                  askProjection();
              }

              private void askProjection() {
                  MediaProjectionManager mpm = getSystemService(MediaProjectionManager.class);
                  Intent i = Build.VERSION.SDK_INT >= 34
                          ? mpm.createScreenCaptureIntent(MediaProjectionConfig.createConfigForDefaultDisplay())
                          : mpm.createScreenCaptureIntent();
                  try {
                      startActivityForResult(i, REQ_PROJECTION);
                  } catch (Exception e) {
                      onError("Ce téléphone refuse la capture du son.");
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  if (code == REQ_PERM_MIC) {
                      if (pendingWebPerm != null) {
                          if (hasMic()) pendingWebPerm.grant(pendingWebPerm.getResources());
                          else pendingWebPerm.deny();
                          pendingWebPerm = null;
                      }
                  } else if (code == REQ_PERM_CAPTURE) {
                      if (hasMic()) askProjection();
                      else onError("Autorise le micro : Android l’exige pour capter le son des autres applis.");
                  }
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  if (code == REQ_FILE) {
                      if (fileCb != null) {
                          fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result, data));
                          fileCb = null;
                      }
                      return;
                  }
                  if (code == REQ_PROJECTION) {
                      if (result != RESULT_OK || data == null) {
                          onError("Capture refusée. Appuie sur Casque, choisis « Tout l’écran » puis Démarrer.");
                          return;
                      }
                      Intent s = new Intent(this, CaptureService.class)
                              .putExtra(CaptureService.EXTRA_CODE, result)
                              .putExtra(CaptureService.EXTRA_DATA, data);
                      startForegroundService(s);
                      return;
                  }
                  super.onActivityResult(code, result, data);
              }

              private void js(final String code) {
                  ui.post(() -> { if (web != null) web.evaluateJavascript(code, null); });
              }

              @Override public void onStarted(int sampleRate) { js("window.__ttCaptureStarted&&__ttCaptureStarted(" + sampleRate + ")"); }
              @Override public void onPcm(String b64) { js("window.__ttPcm&&__ttPcm('" + b64 + "')"); }
              @Override public void onError(String msg) { js("window.__ttCaptureError&&__ttCaptureError(" + JSONObject.quote(msg) + ")"); }
              @Override public void onStopped() { js("window.__ttCaptureStopped&&__ttCaptureStopped()"); }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (CaptureService.listener == this) CaptureService.listener = null;
                  if (isFinishing()) stopService(new Intent(this, CaptureService.class));
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
          TT_EOF_3
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_fg.xml")"
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'TT_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:translateX="29.6" android:translateY="29.6" android:scaleX="2.03" android:scaleY="2.03">
                  <path android:fillColor="#FFA528" android:pathData="M12,1c-4.97,0 -9,4.03 -9,9v7c0,1.66 1.34,3 3,3h3v-8H5v-2c0,-3.87 3.13,-7 7,-7s7,3.13 7,7v2h-4v8h3c1.66,0 3,-1.34 3,-3v-7c0,-4.97 -4.03,-9 -9,-9z" />
              </group>
          </vector>
          TT_EOF_4
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_notif.xml")"
          cat > 'app/src/main/res/drawable/ic_notif.xml' <<'TT_EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,1c-4.97,0 -9,4.03 -9,9v7c0,1.66 1.34,3 3,3h3v-8H5v-2c0,-3.87 3.13,-7 7,-7s7,3.13 7,7v2h-4v8h3c1.66,0 3,-1.34 3,-3v-7c0,-4.97 -4.03,-9 -9,-9z" />
          </vector>
          TT_EOF_5
          mkdir -p "$(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'TT_EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          TT_EOF_6
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > 'app/src/main/res/values/colors.xml' <<'TT_EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#262D33</color>
          </resources>
          TT_EOF_7
          mkdir -p "$(dirname "build.gradle")"
          cat > 'build.gradle' <<'TT_EOF_8'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          TT_EOF_8
          mkdir -p "$(dirname "gradle.properties")"
          cat > 'gradle.properties' <<'TT_EOF_9'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          TT_EOF_9
          mkdir -p "$(dirname "settings.gradle")"
          cat > 'settings.gradle' <<'TT_EOF_10'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TapTempo'
          include ':app'
          TT_EOF_10
          echo "" | base64 -d > app/tt.keystore
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TapTempo.apk
          gh release create "v${{ github.run_number }}" TapTempo.apk --title "Tap Tempo ${{ github.run_number }}" --notes "Télécharge TapTempo.apk sur le téléphone et installe-le." --latest
